plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def appEnv = [:]
[
    rootProject.file(".env"),
    rootProject.file(".env.local"),
    rootProject.file(".env.production")
].each { appEnvFile ->
    if (appEnvFile.exists()) {
        appEnvFile.eachLine { line ->
            def entry = line.trim()
            if (entry && !entry.startsWith("#")) {
                def separator = entry.indexOf("=")
                if (separator > 0) {
                    appEnv[entry.substring(0, separator).trim()] = entry.substring(separator + 1).trim()
                }
            }
        }
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def productionApiBaseUrl = System.getenv("API_BASE_URL") ?: appEnv["API_BASE_URL"] ?: "https://your-api.onrender.com/api/v1/"
def developmentApiBaseUrl = System.getenv("DEBUG_API_BASE_URL") ?: appEnv["DEBUG_API_BASE_URL"] ?: "http://10.0.2.2:5000/api/v1/"

android {
    namespace 'com.notes.diaryapp'
    compileSdk 35

    defaultConfig {
        applicationId "com.notes.diaryapp"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Default production API endpoint
        buildConfigField "String", "API_BASE_URL", "\"${productionApiBaseUrl}\""
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            // Android emulator loopback host for local testing
            buildConfigField "String", "API_BASE_URL", "\"${developmentApiBaseUrl}\""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            def releaseStoreFile = keystoreProperties.getProperty("storeFile") ?: System.getenv("KEYSTORE_PATH")
            def releaseStorePassword = keystoreProperties.getProperty("storePassword") ?: System.getenv("KEYSTORE_PASSWORD")
            def releaseKeyAlias = keystoreProperties.getProperty("keyAlias") ?: System.getenv("KEY_ALIAS")
            def releaseKeyPassword = keystoreProperties.getProperty("keyPassword") ?: System.getenv("KEY_PASSWORD")

            if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                signingConfig signingConfigs.create("release") {
                    storeFile rootProject.file(releaseStoreFile)
                    storePassword releaseStorePassword
                    keyAlias releaseKeyAlias
                    keyPassword releaseKeyPassword
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    // AndroidX & Lifecycle
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'

    // Compose BOM & UI
    def composeBom = platform('androidx.compose:compose-bom:2024.11.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Navigation Compose
    implementation 'androidx.navigation:navigation-compose:2.8.5'

    // Chrome Custom Tabs for OAuth
    implementation 'androidx.browser:browser:1.8.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // Retrofit, OkHttp & Gson
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Secure EncryptedSharedPreferences (Android Keystore)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
